services:
  - type: web
    name: t-lab-ai-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONPATH
        value: .
      - key: PROJECT_NAME
        value: T Lab AI
      - key: CORS_ORIGINS
        value: https://t-lab-ai.pages.dev,https://*.pages.dev,http://localhost:5173,http://localhost:3000
